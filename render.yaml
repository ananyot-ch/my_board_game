# Render Blueprint — `render.yaml`
# Connect this repo to Render and it'll auto-create the service.
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: boardgame-backend
    runtime: docker
    repo: https://github.com/ananyot-ch/my_board_game
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://my-board-game-ten.vercel.app
      # Set these manually in the Render dashboard:
      #   DATABASE_URL    — from Neon
      #   JWT_SECRET      — long random string
      #   GEMINI_API_KEY  — optional
