# Local development stack — `docker compose up`
# - Backend on :3000 (hot-reload via volume mount)
# - Frontend on :5173 (Vite dev server, hot-reload)
# - Postgres on :5432, Redis on :6379

services:
  postgres:
    image: postgres:16-alpine
    container_name: boardgame_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: boardgame
      POSTGRES_PASSWORD: boardgame_pass
      POSTGRES_DB: boardgame_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U boardgame -d boardgame_db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: boardgame_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      target: dev
    container_name: boardgame_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: '3000'
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USERNAME: boardgame
      DB_PASSWORD: boardgame_pass
      DB_NAME: boardgame_db
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_in_prod_min_32_chars}
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:5173
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CLOUDFLARE_API_KEY: ${CLOUDFLARE_API_KEY:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports:
      - '3000:3000'
    volumes:
      - ./backend/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: boardgame_frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:3000
      VITE_API_URL: ''
      VITE_SOCKET_URL: http://localhost:3000
    ports:
      - '5173:5173'
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
